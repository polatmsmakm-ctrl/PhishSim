name: PhishSim
options:
  bundleIdPrefix: com.phishsim
  deploymentTarget:
    iOS: "17.0"
targets:
  PhishSim:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ios
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phishsim.mobile
        PRODUCT_NAME: PhishSim
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: ios/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PhishSim
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
